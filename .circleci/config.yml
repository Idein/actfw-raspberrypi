version: 2.1

references:
  image-tags: &image-tags
    - "python:3.9-bullseye"
    - "python:3.11-bookworm"

commands:
  prepare-ca:
    steps:
      - run:
          name: Distrust compromised CA roots before network access
          shell: /bin/sh -eu
          command: |
            sh scripts/prepare-ca.sh
            if command -v python3 >/dev/null; then python3 scripts/check_ca_trust.py; fi

  install-poetry:
    steps:
      - run:
          name: Install Poetry through patched uv
          environment:
            UV_VERSION: "0.13.6"
          command: |
            curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
            export PATH="$HOME/.local/bin:$PATH"
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
            uv tool install --python "$(command -v python)" --with 'certifi>=2026.10.19' poetry==1.8.5
            "$(uv tool dir)/poetry/bin/python" scripts/check_ca_trust.py --certifi
  poetry-install:
    steps:
      # See: https://circleci.com/docs/2.0/language-python/#cache-dependencies
      - restore_cache:
          key: &cache-key-poetry cache-ca-v1-poetry-{{ .Environment.CIRCLE_JOB }}-{{ .Environment.CIRCLECI_CACHE_VERSION }}-{{ checksum "poetry.toml" }}-{{ checksum "poetry.lock" }}
      - run:
          name: poetry install
          command: |
            poetry config virtualenvs.in-project true
            poetry install --no-ansi
            poetry run python scripts/check_ca_trust.py --certifi
      - save_cache:
          key: *cache-key-poetry
          paths:
            - ".venv"

  prepare-github-writable-user:
    steps:
      - run:
          name: Configure git user
          command: |
            git config user.email "bot@idein.jp"
            git config user.name "ideinbot"
      - add_ssh_keys:
          fingerprints:
            - "70:07:5c:c9:8f:bf:c7:fe:01:a5:84:84:9e:c4:79:01"

jobs:
  lint:
    docker:
      - image: python:3.11-bookworm
        auth: &docker-hub-auth
          username: $DOCKER_USER
          password: $DOCKER_PASS
    steps:
      - checkout
      - prepare-ca
      - install-poetry
      - poetry-install
      - run:
          name: Lint
          command: |
            poetry run pysen run lint
      - run:
          name: Check indirect import
          command: |
            poetry run pyproject-indirect-import-detector -v

  test:
    parameters:
      image-tag:
        type: string
    docker:
      - image: <<parameters.image-tag>>
        auth: *docker-hub-auth
    steps:
      - checkout
      - prepare-ca
      - install-poetry
      - poetry-install
      - run:
          name: Test
          command: poetry run pytest -v
  test-with-up-to-date-dependencies:
    parameters:
      image-tag:
        type: string
    docker:
      - image: <<parameters.image-tag>>
        auth: *docker-hub-auth
    steps:
      - checkout
      - prepare-ca
      - run:
          name: remove lock file to get up-to-date dependencies
          command: rm poetry.lock
      - install-poetry
      - poetry-install
      - run:
          name: Test
          command: poetry run pytest -v

  build-api-doc:
    docker:
      - image: python:3.11-bookworm
        auth: *docker-hub-auth
    steps:
      - checkout
      - prepare-ca
      - install-poetry
      - poetry-install
      - run:
          name: sphinx-build
          command: |
            poetry run sphinx-build docs build/sphinx/html
      - persist_to_workspace:
          root: build/sphinx
          paths:
            - html
      - store_artifacts:  # for reviewers to check generated doc
          path: build/sphinx/html
          destination: html

  build-package:
    docker:
      - image: python:3.11-bookworm
        auth: *docker-hub-auth
    steps:
      - checkout
      - prepare-ca
      - install-poetry
      - poetry-install
      - run:
          name: Make wheel & sdist
          command: |
            poetry build
      - persist_to_workspace:
          root: .
          paths:
            - dist

  validate-version-with-tag:
    docker:
      - image: python:3.11-bookworm
        auth: *docker-hub-auth
    steps:
      - checkout
      - prepare-ca
      - install-poetry
      - poetry-install
      - run:
          name: Check if git tag name is appropriate for package version
          command: |
            TAG=$(echo ${CIRCLE_TAG} |sed -e 's/release-//')
            VERSION=$(poetry run python -c 'import pkg_resources; print(pkg_resources.get_distribution("actfw-raspberrypi").version)')
            echo "Git tag: $TAG"
            echo "Package version: $VERSION"
            test "$VERSION" = "$TAG"

  deploy-api-doc:
    docker:
      - image: python:3.11-bookworm
        auth: *docker-hub-auth
    steps:
      - checkout
      - prepare-ca
      - run:
          name: checkout gh-pages branch
          command: git checkout gh-pages
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Place doc contents in version directory (linked by `latest` symlink)
          command: |
            TAG=$(echo ${CIRCLE_TAG} |sed -e 's/release-//')
            rm -rf $TAG latest
            mkdir $TAG
            cp -rf /tmp/workspace/html/* $TAG/
            ln -s $TAG latest
      - prepare-github-writable-user
      - run:
          name: Deploy docs to gh-pages branch
          command: |
            git add .
            git commit -m '[skip ci] updates API doc'
            git push origin gh-pages

  deploy-package:
    docker:
      - image: python:3.11-bookworm
        auth: *docker-hub-auth
    steps:
      - checkout
      - prepare-ca
      - install-poetry
      - poetry-install
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Publish wheel & sdist to PyPI
          command: |
            mv /tmp/workspace/dist .
            poetry publish --username "__token__" --password "$PYPI_API_TOKEN" --no-interaction

workflows:
  version: 2
  commit:
    jobs:
      - lint:
          context:
            - docker-hub-creds
      - test:
          context:
            - docker-hub-creds
          matrix:
            parameters:
              image-tag: *image-tags
      - build-api-doc:
          context:
            - docker-hub-creds
      - build-package:
          context:
            - docker-hub-creds
  release:
    jobs:
      - validate-version-with-tag:
          context:
            - docker-hub-creds
          filters: &release-filter
            tags:
              only: /^release-[0-9]+(\.[0-9]+){2}((a|b|rc)[0-9]+)?(.post[0-9])?(.dev[0-9])?$/
            branches:
              ignore: /.*/
      - build-api-doc:
          context:
            - docker-hub-creds
          requires:
            - validate-version-with-tag
          filters: *release-filter
      - build-package:
          context:
            - docker-hub-creds
          requires:
            - validate-version-with-tag
          filters: *release-filter
      - deploy-api-doc:
          context:
            - docker-hub-creds
          requires:
            - build-api-doc
          filters: *release-filter
      - deploy-package:
          context:
            - docker-hub-creds
          requires:
            - build-package
          filters: *release-filter
  nightly:
    triggers:
      - schedule:
          cron: "36 23 * * *"  # in UTC
          filters:
            branches:
              only:
                - master
    jobs:
      - lint:
          context:
            - docker-hub-creds
      - test:
          context:
            - docker-hub-creds
          matrix:
            parameters:
              image-tag: *image-tags
      - test-with-up-to-date-dependencies:
          context:
            - docker-hub-creds
          matrix:
            parameters:
              image-tag: *image-tags
      - build-api-doc:
          context:
            - docker-hub-creds
      - build-package:
          context:
            - docker-hub-creds
